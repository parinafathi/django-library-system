<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لیست اعضای کتابخانه</title>
</head>
<body>
      <nav style="background-color: #ffffff; padding: 15px 20px; margin-bottom: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; gap: 20px;">
    <a href="{% url 'book_list' %}" style="text-decoration: none; color: #2c3e50; font-weight: bold; font-size: 16px;">📚 لیست کتاب‌ها</a>
    <a href="{% url 'member_list' %}" style="text-decoration: none; color: #2c3e50; font-weight: bold; font-size: 16px;">👥 لیست اعضا</a>
    <a href="{% url 'add_book' %}" style="text-decoration: none; color: #27ae60; font-weight: bold; font-size: 16px;">➕ افزودن کتاب</a>
</nav>

    <h1>👥 لیست اعضای کتابخانه</h1>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>شناسه</th>
                <th>نام و نام خانوادگی</th>
                <th>ایمیل</th>
            </tr>
        </thead>
        <tbody>
            {% for member in members %}
            <tr>
                <td>{{ member.id }}</td>
                <td>{{ member.name }}</td>
                <td>{{ member.email }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3">هیچ عصوی یافت نشد </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <br>
    <a href="{% url 'book_list' %}">بازگشت به لیست کتاب ها</a>
    
</body>
</html>
